extensions:
  file_storage:
    directory: /tmp/o11y-validator-storage
    create_directory: true
  k8s_leader_elector:
    auth_type: serviceAccount
    lease_name: o11y-validation
    lease_namespace: o11y-validation

receivers:
  host_metrics:
    root_path: /hostfs
    scrapers:
      cpu: {}
      filesystem: {}
      memory: {}
  kubelet_stats:
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_IP}:10250
    insecure_skip_verify: true
    node: ${env:K8S_NODE_NAME}
  k8s_cluster:
    auth_type: serviceAccount
    k8s_leader_elector: k8s_leader_elector
  k8s_events:
    auth_type: serviceAccount
    k8s_leader_elector: k8s_leader_elector
  k8s_objects:
    auth_type: serviceAccount
    k8s_leader_elector: k8s_leader_elector
    objects:
      - name: pods
        mode: pull
  prometheus:
    target_allocator:
      endpoint: http://otel-target-allocator.o11y.svc.cluster.local
      interval: 30s
      collector_id: ${env:K8S_POD_NAME}
  file_log:
    include:
      - /var/log/pods/*/*/*.log
    start_at: end
    storage: file_storage

processors:
  k8s_attributes:
    auth_type: serviceAccount
    filter:
      node_from_env_var: K8S_NODE_NAME

exporters:
  nop: {}

service:
  extensions:
    - file_storage
    - k8s_leader_elector
  pipelines:
    metrics:
      receivers:
        - host_metrics
        - kubelet_stats
        - k8s_cluster
        - prometheus
      processors:
        - k8s_attributes
      exporters:
        - nop
    logs:
      receivers:
        - file_log
        - k8s_cluster
        - k8s_events
        - k8s_objects
      processors:
        - k8s_attributes
      exporters:
        - nop
