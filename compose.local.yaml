name: o11y-control-plane-local

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: o11y_control_plane_local
      POSTGRES_USER: o11y_local
      POSTGRES_PASSWORD: o11y-local-password
    ports:
      - 127.0.0.1:55432:5432
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U o11y_local -d o11y_control_plane_local
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    image: o11y-control-plane:local
    environment:
      DATABASE_URL: postgres://o11y_local:o11y-local-password@postgres:5432/o11y_control_plane_local?sslmode=disable
      MASTER_USERNAME: o11y-admin
      MASTER_PASSWORD: o11y-local-admin-password
      MASTER_EMAIL: local-admin@example.test
      AUTH_SIGNING_KEY: o11y-local-signing-key-for-integration-tests-only
      OPAMP_AUTH_MODE: disabled
      SERVER_PUBLIC_URL: http://127.0.0.1:18080
      OPAMP_PUBLIC_URL: http://127.0.0.1:14320/v1/opamp
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:14320:4320
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles:
      - mail
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
